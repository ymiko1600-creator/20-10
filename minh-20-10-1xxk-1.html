<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sự thức giấc của Minh - Ngày 20/10</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff8fb8; --pink-dark:#e0568f; --pink-light:#ffe3ee;
  --bg1:#2a1030; --bg2:#5a1f55; --gold:#ffd966; --green:#59c77a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Quicksand',sans-serif;color:#fff;overflow-x:hidden;
  background:radial-gradient(circle at 50% 20%,var(--bg2),var(--bg1) 70%);
  min-height:100vh;
}
#fx{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.petal{position:absolute;top:-30px;font-size:18px;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.star{position:absolute;color:#fff;animation:tw 2.5s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}

.screen{position:relative;z-index:2;display:none;min-height:100vh;padding:24px 16px;
  flex-direction:column;align-items:center;justify-content:center;text-align:center}
.screen.active{display:flex;animation:fadeIn .7s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

h1.title{font-family:'Pacifico',cursive;font-size:clamp(28px,7vw,48px);color:var(--pink);
  text-shadow:0 0 18px rgba(255,143,184,.6);margin-bottom:10px}
.deco{letter-spacing:6px;color:var(--pink);opacity:.85;margin:8px 0;font-size:18px}
.hint{opacity:.7;font-size:14px;margin-top:14px}

button,.btn{
  font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;border:none;
  padding:12px 28px;border-radius:999px;color:#fff;text-decoration:none;display:inline-block;
  background:linear-gradient(135deg,var(--pink),var(--pink-dark));
  box-shadow:0 6px 20px rgba(224,86,143,.45);transition:transform .15s,box-shadow .15s;
}
button:hover,.btn:hover{transform:translateY(-2px) scale(1.03)}
button:active{transform:scale(.96)}
.btn.ghost{background:transparent;border:2px solid var(--pink);box-shadow:none}

/* Loading */
.bar{width:min(300px,80vw);height:14px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;margin:18px 0 8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .2s}

/* Minh */
.tiny{position:relative;width:130px;height:130px;margin:10px auto 18px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.tiny .head{position:absolute;inset:10px;border-radius:50%;background:#fff0f5;border:4px solid var(--pink);
  box-shadow:0 0 30px rgba(255,143,184,.6)}
.tiny .eye{position:absolute;top:50px;width:12px;height:16px;background:#4a2040;border-radius:50%;animation:blink 4s infinite}
.tiny .eye.l{left:36px}.tiny .eye.r{right:36px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.tiny .cheek{position:absolute;top:70px;width:16px;height:10px;border-radius:50%;background:#ffb3cc;opacity:.8}
.tiny .cheek.l{left:24px}.tiny .cheek.r{right:24px}
.tiny .mouth{position:absolute;left:50%;top:76px;width:18px;height:9px;transform:translateX(-50%);
  border-bottom:3px solid #4a2040;border-radius:0 0 20px 20px}
.tiny .bow{position:absolute;top:-2px;right:6px;font-size:30px}
.tiny.sleep .eye{height:3px;top:58px;animation:none}

.bubble{position:relative;background:#fff;color:#5a2150;border-radius:22px;padding:18px 22px;
  max-width:min(440px,92vw);min-height:70px;font-size:18px;font-weight:600;line-height:1.5;
  box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.bubble::before{content:"";position:absolute;top:-12px;left:50%;margin-left:-12px;border:12px solid transparent;
  border-top:0;border-bottom-color:#fff}
.clover{font-size:90px;display:inline-block;animation:spin 6s linear infinite;filter:drop-shadow(0 0 16px #59c77a)}
@keyframes spin{to{transform:rotate(360deg)}}
.cloverbox{margin:18px 0 6px;cursor:pointer}

.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}

/* Nút nhạc */
#musicBtn{position:fixed;top:14px;right:14px;z-index:15;width:44px;height:44px;padding:0;font-size:20px;
  display:none;align-items:center;justify-content:center;border-radius:50%}
#musicBtn.show{display:flex}
#musicBtn.off{opacity:.55}

/* Shop */
#shop{justify-content:flex-start;padding-top:36px;padding-bottom:60px}
.shop-title{font-family:'Pacifico',cursive;font-size:clamp(24px,6vw,38px);color:var(--pink);margin-bottom:4px}
.section{width:min(520px,100%);margin-top:26px;text-align:left}
.section h2{font-size:18px;margin-bottom:12px;color:var(--gold);text-align:center}
.item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,143,184,.4);
  border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:.2s;backdrop-filter:blur(4px)}
.item:hover{background:rgba(255,143,184,.25);transform:translateX(4px)}
.item .ic{font-size:30px}
.item .info{flex:1}
.item .name{font-weight:700}
.item .sub{font-size:13px;opacity:.8}
.item .price{font-weight:700;color:var(--gold);white-space:nowrap}

/* Modal */
.modal{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal .card{background:#fff;color:#5a2150;border-radius:22px;padding:22px;width:min(400px,100%);animation:fadeIn .3s}
.modal h3{text-align:center;margin-bottom:14px}
table{width:100%;border-collapse:collapse;margin-bottom:16px}
th,td{padding:8px;border-bottom:1px solid #f3c9dc;text-align:left;font-size:15px}
th{color:var(--pink-dark)}
.modal .row{margin-top:6px}
.modal .btn.ghost{color:var(--pink-dark)}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(80px);z-index:20;background:#fff;color:#5a2150;
  padding:10px 20px;border-radius:99px;font-weight:700;transition:.35s;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="fx"></div>

<!-- 1. Màn hình mở đầu -->
<section class="screen active" id="s-intro">
  <div class="deco">❀ ✿ ❁ ❀ ✿ ❁</div>
  <h1 class="title">Sự thức giấc của Minh</h1>
  <div class="deco">✧ ✧ ✧ ✧ ✧</div>
  <div class="tiny sleep"><div class="head"></div><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div>
  <p>Minh đang ngủ... đánh thức bạn ấy nhé</p>
  <br>
  <button id="wake">Đánh thức Minh ♡</button>
  <p class="hint">♪ ♫ ♬ ♪ ♫</p>
</section>

<!-- 2. Hội thoại -->
<section class="screen" id="s-talk">
  <div class="tiny"><div class="head"></div><div class="eye l"></div><div class="eye r"></div>
    <div class="cheek l"></div><div class="cheek r"></div><div class="mouth"></div><div class="bow">🎀</div></div>
  <div class="bubble"><span id="line"></span></div>
  <div class="cloverbox" id="cloverbox" style="display:none"><span class="clover">🍀</span></div>
  <br>
  <button id="next">Tiếp ›</button>
  <p class="hint" id="talkhint">chạm "Tiếp" để nghe Minh nói</p>
</section>

<!-- 3. Cửa hàng -->
<section class="screen" id="s-shop">
  <div class="tiny" style="width:90px;height:90px"><div class="head" style="inset:6px"></div><div class="eye l" style="top:34px;left:24px"></div><div class="eye r" style="top:34px;right:24px"></div><div class="mouth" style="top:52px"></div></div>
  <h1 class="shop-title">cậu muốn được tặng gì?</h1>
  <div class="deco">✿ ✿ ✿</div>

  <div class="section">
    <div id="listF"></div>
  </div>
</section>

<!-- Modal mua hàng -->
<div class="modal" id="modal">
  <div class="card">
    <h3>cậu muốn mua cái này hả</h3>
    <table>
      <tr><th>Gian hàng</th><td id="mType"></td></tr>
      <tr><th>Tên sản phẩm</th><td id="mName"></td></tr>
      <tr><th>Giá</th><td id="mPrice"></td></tr>
    </table>
    <div class="row">
      <a class="btn" id="mBuy" href="#" target="_blank" rel="noopener">Mua ↗</a>
      <button class="btn ghost" id="mClose">Đóng</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<button id="musicBtn" title="Bật/tắt nhạc">🔊</button>

const $ = s => document.querySelector(s);
const show = id => {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0,0);
};
const toast = msg => {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
};

/* Hiệu ứng cánh hoa + sao */
(function fx(){
  const box = $('#fx'), petals = ['🌸','🌷','✿','❀','💮'];
  for (let i=0;i<22;i++){
    const p = document.createElement('div'); p.className='petal';
    p.textContent = petals[i % petals.length];
    p.style.left = Math.random()*100+'vw';
    p.style.fontSize = (12+Math.random()*16)+'px';
    p.style.animationDuration = (8+Math.random()*10)+'s';
    p.style.animationDelay = (-Math.random()*14)+'s';
    box.appendChild(p);
  }
  for (let i=0;i<30;i++){
    const s = document.createElement('div'); s.className='star'; s.textContent='✦';
    s.style.left = Math.random()*100+'vw'; s.style.top = Math.random()*100+'vh';
    s.style.fontSize = (6+Math.random()*10)+'px';
    s.style.animationDelay = (Math.random()*3)+'s';
    box.appendChild(s);
  }
})();

/* Màn 1 → 2 */
$('#wake').onclick = () => { startMusic(); show('#s-talk'); say(0); };

/* Hội thoại kiểu gõ chữ */
let idx = 0, typing = null;
function say(i){
  idx = i;
  const el = $('#line'); el.textContent = '';
  const text = LINES[i]; let n = 0;
  clearInterval(typing);
  typing = setInterval(() => {
    el.textContent = text.slice(0, ++n);
    if (n >= text.length) clearInterval(typing);
  }, 38);
  $('#cloverbox').style.display = (i >= 7 && i <= 9) ? 'block' : 'none';
  $('#talkhint').style.display = i === 0 ? 'block' : 'none';
  $('#next').textContent = i === LINES.length-1 ? 'Sang đi~ ›' : 'Tiếp ›';
}
$('#next').onclick = () => {
  if (idx >= LINES.length-1){ show('#s-shop'); return; }
  say(idx+1);
};
$('#cloverbox').onclick = () => toast('🍀 chúc cậu thật nhiều may mắn!');

/* Nhạc nền – phát file mp3 đã nhúng khi bấm "Đánh thức" (không có nhạc nào khác) */
let actx = null, bufSrc = null, audioEl = null, decoded = null;
let mode = '', musicOn = false, userMuted = false, attempted = false;

function b64ToBuffer(dataUri){
  const bin = atob(dataUri.split(',')[1]);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8.buffer;
}
function setMusicUI(){
  const b = $('#musicBtn');
  b.classList.add('show'); b.classList.toggle('off', !musicOn);
  b.textContent = musicOn ? '🔊' : '🔇';
}
/* Cách 1: giải mã mp3 bằng Web Audio rồi lặp lại (chạy được cả khi trình xem chặn thẻ <audio>) */
async function playBuffer(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) throw new Error('no AudioContext');
  actx = actx || new AC();
  const resumed = actx.resume();
  if (!decoded){
    const ab = b64ToBuffer(MUSIC_URL);
    decoded = await new Promise((ok, bad) => {
      const p = actx.decodeAudioData(ab, ok, bad);
      if (p && p.catch) p.catch(bad);
    });
  }
  await resumed;
  const g = actx.createGain(); g.gain.value = 0.85;
  bufSrc = actx.createBufferSource();
  bufSrc.buffer = decoded; bufSrc.loop = true;
  bufSrc.connect(g); g.connect(actx.destination);
  bufSrc.start(0);
  mode = 'buffer';
}
/* Cách 2 (dự phòng): thẻ <audio> */
async function playElement(){
  audioEl = audioEl || Object.assign(new Audio(MUSIC_URL), {loop:true, volume:.85});
  await audioEl.play();
  mode = 'element';
}
async function startMusic(){
  attempted = true; userMuted = false;
  $('#musicBtn').classList.add('show');
  try{
    if (mode === 'buffer' && bufSrc)        await actx.resume();
    else if (mode === 'element' && audioEl) await audioEl.play();
    else { try{ await playBuffer(); }catch(e){ await playElement(); } }
    musicOn = true;
  }catch(e){ musicOn = false; }
  setMusicUI();
}
function stopMusic(){
  userMuted = true; musicOn = false;
  if (mode === 'buffer' && actx) actx.suspend();
  if (audioEl) audioEl.pause();
  setMusicUI();
}
$('#musicBtn').onclick = () => musicOn ? stopMusic() : startMusic();
/* nếu lần phát đầu bị chặn, chạm vào bất cứ đâu (trừ nút nhạc) sẽ thử phát lại */
document.addEventListener('pointerdown', e => {
  if (e.target.closest('#musicBtn') || userMuted || musicOn || !attempted) return;
  startMusic();
});

/* Cửa hàng */
function render(list, target, type){
  const box = $(target);
  list.forEach(p => {
    const d = document.createElement('div'); d.className='item';
    d.innerHTML = `<div class="ic">${p.icon}</div>
      <div class="info"><div class="name">${p.name}</div><div class="sub">${p.note}</div></div>
      <div class="price">${p.price} ↗</div>`;
    d.onclick = () => openModal(type, p);
    box.appendChild(d);
  });
}
render(FEMALE,'#listF','Gian hàng nữ');

function openModal(type, p){
  $('#mType').textContent = type;
  $('#mName').textContent = p.name;
  $('#mPrice').textContent = p.price;
  $('#mBuy').href = p.url;
  $('#modal').classList.add('open');
}
$('#mClose').onclick = () => $('#modal').classList.remove('open');
$('#modal').onclick = e => { if (e.target.id==='modal') $('#modal').classList.remove('open'); };
